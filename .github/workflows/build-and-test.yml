name: Build and Test

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      # The in-browser voice trainer has its own workflow (voice-trainer.yml);
      # changes that only touch it don't need a desktop build.
      - "web/**"
      - ".github/workflows/voice-trainer.yml"
      - ".github/workflows/build-and-test.yml"
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - "web/**"
      - ".github/workflows/voice-trainer.yml"
      - ".github/workflows/build-and-test.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile binary
      run: make PRAAT_GRAPHICS=barren PRAAT_AUDIO=none

    - name: Run /test scripts
      run: ./praat_barren --FULL-TRUST --run test/runAllTests_batch.praat

    - name: Run /dwtest scripts
      run: ./praat_barren --FULL-TRUST --run dwtest/runAllTests_batch.praat
